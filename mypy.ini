[mypy]
# Add the typings directory to the path
mypy_path = typings

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = True

# Be more strict about type checking
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False  # Set to True when ready for stricter checking

[mypy-pyqtgraph.*]
# Use our custom stubs for pyqtgraph
ignore_missing_imports = False