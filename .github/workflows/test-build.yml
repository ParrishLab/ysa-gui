name: Test Build

on:
  pull_request:
    branches: [main]

  workflow_dispatch: {}

jobs:
  build:
    uses: ./.github/workflows/shared-build.yml
    with:
      artifact_retention_days: 7
      upload_artifacts: true

  # Aggregate status check - this is what GitHub branch protection looks for
  test-build-status:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
          echo "Build passed"
