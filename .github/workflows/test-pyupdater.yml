name: Test PyUpdater (Manual)

permissions:
  contents: write

on:
  workflow_dispatch: {} # Manual trigger only

jobs:
  build:
    uses: ./.github/workflows/shared-build.yml
    with:
      artifact_retention_days: 7
      upload_artifacts: true

  # Create a test release for manual testing
  test-release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Download PyUpdater packages only
      - name: Download PyUpdater MacOS Intel
        uses: actions/download-artifact@v4
        with:
          name: pyupdater-macos-x86_64
          path: pyupdater/macos-x86_64/

      - name: Download PyUpdater MacOS Silicon
        uses: actions/download-artifact@v4
        with:
          name: pyupdater-macos-arm64
          path: pyupdater/macos-arm64/

      - name: Download PyUpdater Windows
        uses: actions/download-artifact@v4
        with:
          name: pyupdater-windows
          path: pyupdater/windows/

      # Merge PyUpdater artifacts
      - name: Merge PyUpdater packages
        run: |
          mkdir -p pyupdater-deploy
          # Copy all PyUpdater files into one directory
          find pyupdater -type f -exec cp {} pyupdater-deploy/ \;

          echo "PyUpdater files:"
          ls -lh pyupdater-deploy/

      - name: Read version from Constants.py
        id: release_ver
        shell: bash
        run: |
          version=$(grep -E '^__version__\s*=\s*["\x27]' src/helpers/Constants.py | sed -E 's/.*["\x27]([^"\x27]+)["\x27].*/\1/')
          if [ -z "$version" ]; then
            echo "Error: Could not extract version from Constants.py"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=test-v$version" >> $GITHUB_OUTPUT
          echo "Version from Constants.py: $version"

      - name: Create Test Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.release_ver.outputs.tag }}
          name: Test Release ${{ steps.release_ver.outputs.version }}
          prerelease: true
          draft: false
          files: |
            pyupdater-deploy/*
          fail_on_unmatched_files: true
          body: |
            ## Test Release - YSA GUI ${{ steps.release_ver.outputs.version }}

            ⚠️ **This is a TEST release for PyUpdater validation**

            ### Testing Instructions

            1. Download the PyUpdater artifacts from this release
            2. Follow the testing guide in `.github/workflows/TESTING_PYUPDATER.md`
            3. This release will be deleted after testing

            ### Files in this release
            - `versions.gz` - Update manifest
            - `keys.gz` - Public key for verification
            - Various `.zip` files - The actual update packages

            Built from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
