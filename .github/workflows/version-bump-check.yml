name: Version Bump Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check-version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate double quotes in version
        run: |
          version_line=$(grep -E '^__version__\s*=' src/helpers/Constants.py)
          echo "Found version line: $version_line"

          # Check if version uses double quotes (not single quotes)
          if ! echo "$version_line" | grep -q '__version__\s*=\s*"'; then
            echo ""
            echo "ERROR: __version__ must use double quotes, not single quotes!"
            echo "   Found: $version_line"
            echo "   Expected format: __version__ = \"1.0.2\""
            echo ""
            echo "   See comment in src/helpers/Constants.py for why double quotes are required."
            exit 1
          fi
          echo "OK: Version uses double quotes"

      - name: Get version from PR branch
        id: pr_version
        run: |
          pr_version=$(grep -E '^__version__\s*=\s*"' src/helpers/Constants.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$pr_version" ]; then
            echo "Error: Could not extract version from Constants.py in PR branch"
            exit 1
          fi
          echo "version=$pr_version" >> $GITHUB_OUTPUT
          echo "PR branch version: $pr_version"

      - name: Get version from main branch
        id: main_version
        run: |
          # Fetch main branch
          git fetch origin main:main

          # Get version from main branch without checking out (only check double quotes)
          main_version=$(git show origin/main:src/helpers/Constants.py | grep -E '^__version__\s*=\s*"' | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$main_version" ]; then
            echo "Error: Could not extract version from Constants.py in main branch"
            exit 1
          fi
          echo "version=$main_version" >> $GITHUB_OUTPUT
          echo "Main branch version: $main_version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install packaging library
        run: pip install packaging

      - name: Compare versions
        run: |
          python3 << 'EOF'
          from packaging import version

          pr_ver = "${{ steps.pr_version.outputs.version }}"
          main_ver = "${{ steps.main_version.outputs.version }}"

          print(f"PR version:   {pr_ver}")
          print(f"Main version: {main_ver}")

          try:
              pr_parsed = version.parse(pr_ver)
              main_parsed = version.parse(main_ver)

              if pr_parsed <= main_parsed:
                  print(f"\nERROR: Version must be bumped before merging to main!")
                  print(f"   Current main version: {main_ver}")
                  print(f"   PR version:          {pr_ver}")
                  print(f"\n   Please update __version__ in src/helpers/Constants.py")
                  exit(1)
              else:
                  print(f"\nOK: Version bump detected: {main_ver} -> {pr_ver}")
          except Exception as e:
              print(f"\nERROR: Invalid version format: {e}")
              exit(1)
          EOF
