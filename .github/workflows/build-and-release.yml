name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main] # build and release when pushed to main

  workflow_dispatch: {} # allow manual workflow runs

jobs:
  build:
    uses: ./.github/workflows/shared-build.yml
    with:
      artifact_retention_days: 1
      upload_artifacts: true

  release:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download MacOS Intel Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-package-x86_64
          path: .

      - name: Download MacOS Silicon Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-package-arm64
          path: .

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: .

      - name: Read version from Constants.py
        id: release_ver
        shell: bash
        run: |
          version=$(grep -E '^__version__\s*=\s*["\x27]' src/helpers/Constants.py | sed -E 's/.*["\x27]([^"\x27]+)["\x27].*/\1/')
          if [ -z "$version" ]; then
            echo "Error: Could not extract version from Constants.py"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT
          echo "Version from Constants.py: $version"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.release_ver.outputs.tag }}
          name: Release ${{ steps.release_ver.outputs.version }}
          prerelease: false
          files: |
            YSA_GUI_MacOS_x86_64.pkg
            YSA_GUI_MacOS_arm64.pkg
            YSA_GUI_Windows.exe
          fail_on_unmatched_files: true
          body: |
            ## YSA GUI ${{ steps.release_ver.outputs.version }}

            ### Downloads
            - **macOS Intel**: YSA_GUI_MacOS_x86_64.pkg
            - **macOS Silicon**: YSA_GUI_MacOS_arm64.pkg
            - **Windows**: YSA_GUI_Windows.exe

            Built from commit ${{ github.sha }}
